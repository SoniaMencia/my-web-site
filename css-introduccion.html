<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCS Intro Inline</title>
    <!-- aplicar Reglas de Estilo de CSS de forma interna, 
     implica utilizar la eqiqueta (tag) Style en la cabecera 
     del documento, en primer lugar y en segundo utilizar los
    selectores correpondientes -->

     <style>
/* Selectores Simples */ 
/* Primero: x el tipo de elemento */ 



p { color: white;background-color: black;
  
    color: yellow;background-color: blue;
}

    /*segundo: por el ID del elemento, que no se puede repetir */

#p2 

{ 

    color: white;
    background-color: aquamarine;
    border: 2px solid red
}

/* Tercero: Por el atributo de clase del elemento */

.info 

{ font: size 200px; ;


}


     </style>
</head>
<body>
    <h1>cascade style sheet (CSS) 
    </h1>

<p id="pl" estudiando las hojas de estilo en cascada></p>>
<p id="pl" aplicando las reglas de estilo internas ></p>>
   
<p class="info" >parrafo 3</p>
<p class="info" >parrafo 4</p>

<p class="info" >parrafo 5</p>

   

</body>
</html>
